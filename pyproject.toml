[project]
name = "competitor-intel-crew"
version = "0.1.0"
description = "A CrewAI multi-agent system that turns competitor URLs into a structured pricing/feature/positioning comparison."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "competitor-intel-crew contributors" }]
keywords = ["crewai", "agents", "competitor-intelligence", "llm", "scraping"]

dependencies = [
    "crewai[anthropic]==1.15.22",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "typer>=0.12",
]

[project.optional-dependencies]
ui = ["streamlit>=1.36"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
competitor-intel = "competitor_intel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/competitor_intel"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["B008"]  # typer uses function-call defaults (Option/Argument) by design

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "."]
filterwarnings = ["ignore::DeprecationWarning"]
